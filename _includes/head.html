{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  /* 1. Upper navigation bar (Site title & menu links) */
  .masthead,
  .masthead__inner-wrap,
  .greedy-nav,
  .greedy-nav a,
  .site-title {
    font-family: Verdana, sans-serif !important;
  }

  /* 2. Left sidebar info (Author name, bio, location, links) */
  .sidebar,
  .author__name,
  .author__bio,
  .author__urls-wrapper,
  .author__urls li,
  .author__urls a {
    font-family: Arial, Helvetica, sans-serif !important;
  }

  /* 3. Page & section headings */
  h1, h2, h3, h4, h5, h6,
  .page__title,
  .archive__item-title {
    font-family: Georgia, serif !important;
  }

  /* 4. Main page body text */
  body,
  .page__content p,
  .page__content li {
    font-family: "Times New Roman", Times, serif !important;
    text-align: justify;
  }

  /* 5. Code blocks (optional) */
  code, pre {
    font-family: "Courier New", Courier, monospace !important;
  }

    /* Make sidebar avatar square */
  .author__avatar img {
    border-radius: 0 !important;
  }

</style>
