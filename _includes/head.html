{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  /* 1. Upper navigation bar (Site title & menu links) */
  .masthead,
  .masthead__inner-wrap,
  .greedy-nav,
  .greedy-nav a,
  .site-title {
    font-family: Verdana, sans-serif !important;
  }

  /* 2. Left sidebar info (Author name, bio, location, links) */
  .sidebar,
  .author__name,
  .author__bio,
  .author__urls-wrapper,
  .author__urls li,
  .author__urls a {
    font-family: Arial, Helvetica, sans-serif !important;
  }

  /* 3. Page & section headings */
  h1, h2, h3, h4, h5, h6,
  .page__title,
  .archive__item-title {
    font-family: Georgia, serif !important;
  }

  /* 4. Main page body text */
  body,
  .page__content p,
  .page__content li {
    font-family: "Times New Roman", Times, serif !important;
    text-align: justify;
  }

  /* 5. Code blocks (optional) */
  code, pre {
    font-family: "Courier New", Courier, monospace !important;
  }

    /* Make sidebar avatar square */
  .author__avatar img {
    border-radius: 0 !important;
  }

    /* Increase gap between left sidebar and main body text on desktop */
  @media (min-width: 64em) {
    .sidebar {
      padding-right: 60px !important; /* Default is usually ~10px–20px; increase as needed */
    }
  }

    /* Hide bottom footer bar */
  .page__footer {
    display: none !important;
  }

    /* 1. Page background & main text color */
  body {
    background-color: #fafafa !important; /* Soft off-white (use #ffffff for pure white, #1a1a1a for dark mode) */
    color: #222222 !important;            /* Main text color */
  }

  /* 2. Top navigation bar background & link color */
  .masthead,
  .greedy-nav {
    background-color: #1b365d !important; /* Dark navy header */
  }
  .masthead a,
  .greedy-nav a,
  .site-title {
    color: #ffffff !important;            /* White menu text */
  }

  /* 3. Headings color */
  h1, h2, h3, h4, h5, h6 {
    color: #1b365d !important;            /* Matching navy headings */
  }

  /* 4. Hyperlink color & hover color */
  a {
    color: #0056b3 !important;            /* Link color */
  }
  a:hover {
    color: #003366 !important;            /* Darker shade when hovering */
  }




</style>
